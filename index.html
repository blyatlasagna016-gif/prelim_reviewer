<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reviewer Hub</title>
<style>
  :root{
    --bg:#EAEDF5;
    --bg2:#F4F6FB;
    --card:#FFFFFF;
    --ink:#151721;
    --muted:#616880;
    --faint:#8B92A8;
    --line:#E1E5EF;
    --line-strong:#CDD3E2;
    --accent:#4B3BD6;
    --accent-ink:#FFFFFF;
    --accent-soft:#EBE8FC;
    --shadow:0 1px 2px rgba(20,24,50,.06), 0 12px 28px -14px rgba(20,24,50,.28);
  }
  html[data-theme="dark"]{
    --bg:#0C0E15;
    --bg2:#12151E;
    --card:#171A25;
    --ink:#E9EBF3;
    --muted:#98A0B6;
    --faint:#6E7690;
    --line:#252A38;
    --line-strong:#333A4C;
    --accent:#9E8FFF;
    --accent-ink:#14101F;
    --accent-soft:#221E3B;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 18px 34px -18px rgba(0,0,0,.8);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:var(--bg);
    background-image:radial-gradient(120% 60% at 50% 0%, var(--bg2) 0%, var(--bg) 62%);
    background-attachment:fixed;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    -webkit-text-size-adjust:100%;
    line-height:1.5;
    min-height:100vh;
    padding:0 16px calc(28px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:600px;margin:0 auto;}

  header{
    display:flex;align-items:flex-start;gap:12px;
    padding:22px 2px 18px;
  }
  .mark{flex:none;width:34px;height:34px;color:var(--accent);margin-top:2px;}
  .titles{flex:1;min-width:0;}
  h1{
    margin:0;
    font-size:1.5rem;
    font-weight:800;
    letter-spacing:-.024em;
    line-height:1.15;
  }
  .sub{
    margin:4px 0 0;
    font-size:.8125rem;
    color:var(--muted);
    letter-spacing:.005em;
  }
  .theme-btn{
    flex:none;
    width:38px;height:38px;
    display:grid;place-items:center;
    border:1px solid var(--line);
    border-radius:12px;
    background:var(--card);
    color:var(--muted);
    cursor:pointer;
    transition:color .15s ease, border-color .15s ease;
  }
  .theme-btn:hover{color:var(--accent);border-color:var(--line-strong);}
  .theme-btn svg{width:17px;height:17px;}

  .lede{
    margin:2px 2px 18px;
    font-size:.9375rem;
    color:var(--muted);
    max-width:46ch;
  }

  .deck{display:grid;gap:10px;}
  .deck-link{
    display:flex;align-items:center;gap:14px;
    padding:16px 17px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:18px;
    box-shadow:var(--shadow);
    text-decoration:none;
    color:inherit;
    transition:border-color .15s ease, transform .15s ease;
  }
  .deck-link:hover{border-color:var(--accent);}
  .deck-link:active{transform:scale(.99);}
  .deck-icon{
    flex:none;
    width:44px;height:44px;
    border-radius:13px;
    background:var(--accent-soft);
    color:var(--accent);
    display:grid;place-items:center;
  }
  .deck-icon svg{width:22px;height:22px;}
  .deck-body{flex:1;min-width:0;}
  .deck-t{display:block;font-weight:700;font-size:1rem;letter-spacing:-.01em;}
  .deck-d{display:block;font-size:.8125rem;color:var(--muted);margin-top:2px;line-height:1.4;}
  .deck-n{
    flex:none;
    font-size:.75rem;font-weight:700;
    color:var(--faint);
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }
  .chev{flex:none;width:16px;height:16px;color:var(--faint);}

  .empty-note{
    margin-top:18px;
    padding:16px 17px;
    border:1.5px dashed var(--line-strong);
    border-radius:18px;
    font-size:.8125rem;
    color:var(--faint);
    text-align:center;
  }

  footer{text-align:center;margin:22px 0 0;font-size:.75rem;color:var(--faint);}

  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
      <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
    </svg>
    <div class="titles">
      <h1>Reviewer Hub</h1>
      <p class="sub">Pick a subject to start reviewing</p>
    </div>
    <button class="theme-btn" id="themeBtn" aria-label="Switch to dark mode" title="Switch theme">
      <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <p class="lede">Every reviewer works offline once the page has loaded. Tap a subject to jump in.</p>

  <!-- ============================================================
       Add a new subject: copy one <a class="deck-link"> block,
       change the href to your new folder ("/newsubject/"), the
       icon path if you like, and the title/description/count.
       ============================================================ -->
  <div class="deck">

    <a class="deck-link" href="gamedev/">
      <span class="deck-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="7" width="20" height="12" rx="5"/>
          <path d="M7 11v4M5 13h4M15.5 12.5h.01M18 15h.01"/>
        </svg>
      </span>
      <span class="deck-body">
        <span class="deck-t">Game Development Basics</span>
        <span class="deck-d">Platforms &amp; player modes, goals &amp; genres</span>
      </span>
      <span class="deck-n">89 Q</span>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </a>

  </div>

  <!-- Uncomment and show this instead if a deck array is ever empty
  <div class="empty-note">No reviewers here yet.</div>
  -->

  <footer>Works offline. Nothing is sent anywhere.</footer>
</div>

<script>
  const $ = id => document.getElementById(id);
  const SUN = '<circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/>';
  const MOON = '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>';

  function setTheme(t){
    document.documentElement.setAttribute("data-theme", t);
    $("themeIcon").innerHTML = t === "dark" ? SUN : MOON;
    $("themeBtn").setAttribute("aria-label", t === "dark" ? "Switch to light mode" : "Switch to dark mode");
  }
  $("themeBtn").addEventListener("click", () => {
    const t = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    setTheme(t);
    try{ localStorage.setItem("reviewerTheme", t); }catch(e){}
  });

  let saved = null;
  try{ saved = localStorage.getItem("reviewerTheme"); }catch(e){}
  setTheme(saved || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
</script>
</body>
</html>
